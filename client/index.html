<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Life Tracker</title>

    <!-- Apply the saved (or OS) theme before first paint so there is no flash -->
    <script>
      try {
        var t = localStorage.getItem('lt_theme2');
        if (['light', 'dark', 'spidey', 'amazing'].indexOf(t) < 0) t = 'spidey';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'spidey'; }
    </script>

    <!-- Install-to-home-screen (Android/Chrome + iOS Safari) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Life Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
